name: Feature request
description: Propose a focused improvement to GeRAFE
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What scientific or editing task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want, without requiring a particular implementation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example workflow
      description: Include a representative workflow, mockup, or link to public data if useful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
