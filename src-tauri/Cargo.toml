[package]
name = "gerafe"
version = "0.1.0"
description = "GeRAFE — Genomic Renderer and Figure Editor"
authors = ["Stengel-Raskin Lab"]
edition = "2021"

[lib]
name = "gerafe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
dirs = "6"
